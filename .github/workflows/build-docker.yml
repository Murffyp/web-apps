name: Build Web-Apps Docker (Local Use - ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image for ARM64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.docker/web-apps.bake.Dockerfile
          platforms: linux/arm64
          push: false
          outputs: type=docker,dest=/tmp/web-apps-image.tar
          tags: web-apps:latest
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-apps-docker-image-arm64
          path: /tmp/web-apps-image.tar
          retention-days: 30
